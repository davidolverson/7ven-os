name: Org OS CI

on:
  push:
    branches:
      - org-os-production-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: org-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: org_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d org_os"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      APP_ENV: staging
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      PRIVACY_HASH_SECRET: fedcba9876543210fedcba9876543210fedcba9876543210
      AUTH_DATABASE_URL: postgresql://org_auth:auth-ci-password@127.0.0.1:5432/org_os?options=-c%20search_path%3Dauth
      DATABASE_URL: postgresql://org_app:app-ci-password@127.0.0.1:5432/org_os?options=-c%20search_path%3Dapp,public
      ALLOW_PUBLIC_SIGNUP: "false"
      APPLICATION_INTAKE_ENABLED: "false"
      BREAK_GLASS_PRINCIPAL: ""
      E2E_ADMIN_EMAIL: e2e-admin@example.test
      E2E_ADMIN_PASSWORD: E2E-Only-Password-2026!
      E2E_PRIVILEGED_EMAIL: e2e-privileged@example.test
      E2E_PRIVILEGED_PASSWORD: E2E-Privileged-Password-2026!
      E2E_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --include=dev --no-fund --no-audit

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Prepare PostgreSQL roles and schemas
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d org_os -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'org_auth') THEN
              CREATE ROLE org_auth LOGIN PASSWORD 'auth-ci-password';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'org_migrator') THEN
              CREATE ROLE org_migrator LOGIN PASSWORD 'migrator-ci-password';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'org_app') THEN
              CREATE ROLE org_app LOGIN PASSWORD 'app-ci-password';
            END IF;
          END $$;
          GRANT CONNECT ON DATABASE org_os TO org_auth, org_migrator, org_app;
          GRANT CREATE ON DATABASE org_os TO org_migrator;
          CREATE SCHEMA IF NOT EXISTS auth AUTHORIZATION org_auth;
          CREATE SCHEMA IF NOT EXISTS app AUTHORIZATION org_migrator;
          REVOKE CREATE ON SCHEMA app FROM PUBLIC;
          GRANT USAGE ON SCHEMA app TO org_app;
          SQL

      - name: Migrate Better Auth schema
        working-directory: apps/web
        run: npx --yes auth@1.7.1 migrate --config src/lib/auth.ts --yes

      - name: Apply Org application migrations
        env:
          PGPASSWORD: migrator-ci-password
        run: |
          for file in infra/db/migrations/*.sql; do
            echo "Applying $file"
            psql -h 127.0.0.1 -U org_migrator -d org_os -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Grant runtime application privileges
        env:
          PGPASSWORD: migrator-ci-password
        run: |
          psql -h 127.0.0.1 -U org_migrator -d org_os -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA app TO org_app;
          GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA app TO org_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA app TO org_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE org_migrator IN SCHEMA app
            GRANT SELECT, INSERT, UPDATE ON TABLES TO org_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE org_migrator IN SCHEMA app
            GRANT USAGE, SELECT ON SEQUENCES TO org_app;
          SQL

      - name: Verify database integrity invariants
        env:
          PGPASSWORD: migrator-ci-password
        run: psql -h 127.0.0.1 -U org_migrator -d org_os -v ON_ERROR_STOP=1 -f infra/db/tests/001_invariants.sql

      - name: Verify runtime database least privilege
        shell: bash
        run: |
          set -euo pipefail
          if PGPASSWORD=app-ci-password psql -h 127.0.0.1 -U org_app -d org_os -v ON_ERROR_STOP=1 -c 'CREATE TABLE app.__runtime_ddl_must_fail(id integer);'; then
            echo 'ERROR: runtime role unexpectedly created DDL in app schema'
            exit 1
          fi
          if PGPASSWORD=app-ci-password psql -h 127.0.0.1 -U org_app -d org_os -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM auth."user";'; then
            echo 'ERROR: runtime app role unexpectedly read auth schema'
            exit 1
          fi
          if PGPASSWORD=app-ci-password psql -h 127.0.0.1 -U org_app -d org_os -v ON_ERROR_STOP=1 -c 'DELETE FROM app.role_assignment;'; then
            echo 'ERROR: runtime app role unexpectedly deleted role history'
            exit 1
          fi
          PGPASSWORD=app-ci-password psql -h 127.0.0.1 -U org_app -d org_os -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM app.application;'

      - name: Create isolated E2E identity admin
        working-directory: apps/web
        run: >-
          npx --yes auth@1.7.1 create-admin
          --config src/lib/auth.ts
          --email "$E2E_ADMIN_EMAIL"
          --password "$E2E_ADMIN_PASSWORD"
          --name "E2E Identity Admin"
          --role admin
          --yes

      - name: Create privileged E2E identity
        working-directory: apps/web
        run: >-
          npx --yes auth@1.7.1 create-admin
          --config src/lib/auth.ts
          --email "$E2E_PRIVILEGED_EMAIL"
          --password "$E2E_PRIVILEGED_PASSWORD"
          --name "E2E Privileged Without 2FA"
          --role admin
          --yes

      - name: Seed Org privilege without 2FA for negative authorization test
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d org_os -v ON_ERROR_STOP=1 -v privileged_email="$E2E_PRIVILEGED_EMAIL" <<'SQL'
          INSERT INTO app.person_profile (auth_user_id, display_name, membership_status)
          SELECT id, 'E2E Privileged Without 2FA', 'community'
            FROM auth."user"
           WHERE lower(email) = lower(:'privileged_email')
          ON CONFLICT (auth_user_id) DO UPDATE
            SET display_name = EXCLUDED.display_name,
                active = true,
                updated_at = now();

          INSERT INTO app.role_assignment (person_id, role_key, scope_type, reason)
          SELECT pp.id, 'privileged_admin', 'organization', 'CI negative test: Org role exists while 2FA remains disabled.'
            FROM app.person_profile pp
            JOIN auth."user" au ON au.id = pp.auth_user_id
           WHERE lower(au.email) = lower(:'privileged_email')
             AND NOT EXISTS (
               SELECT 1
                 FROM app.role_assignment ra
                WHERE ra.person_id = pp.id
                  AND ra.role_key = 'privileged_admin'
                  AND ra.scope_type = 'organization'
                  AND ra.scope_id IS NULL
                  AND ra.starts_at <= now()
                  AND (ra.ends_at IS NULL OR ra.ends_at > now())
             );
          SQL

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run adversarial browser matrix
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
