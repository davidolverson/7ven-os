name: F0 Lockfile Probe

on:
  push:
    branches:
      - org-os-production-foundation

permissions:
  contents: write

jobs:
  generate-and-commit-reviewed-cli-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Generate exact auth CLI lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm install --workspace apps/web --save-dev --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund auth@1.7.1
          node -e "const p=require('./apps/web/package.json'); if (p.devDependencies?.auth !== '1.7.1') throw new Error('auth CLI dependency is not exact 1.7.1')"
          node -e "const l=require('./package-lock.json'); const p=l.packages?.['node_modules/auth']; if (!p || p.version !== '1.7.1' || p.integrity !== 'sha512-4ro0Na2hJBCb6T9Na5mIjY6KRGFGxeLTGY8FQxklNZ93jyAqR2Xn1bkhk9c0qkCAnWQ8AAPBs36C192bShjkeg==') throw new Error('auth CLI lock entry does not match reviewed 1.7.1 package integrity')"
      - name: Commit lockfile-backed CLI and remove probe
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/f0-lockfile-probe.yml
          git config user.name "F0 Lockfile Probe"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/package.json package-lock.json .github/workflows/f0-lockfile-probe.yml
          git diff --cached --check
          git commit -m "chore: lock Better Auth CLI 1.7.1"
          git push origin HEAD:org-os-production-foundation
